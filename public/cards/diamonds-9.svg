<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer Cardstock with Corner Radii -->
  <rect x="8" y="8" width="484" height="684" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="22" y="22" width="456" height="656" rx="20" fill="none" stroke="#fee2e2" stroke-width="2"/>
  <rect x="30" y="30" width="440" height="640" rx="16" fill="none" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(62, 82)">
    <text x="0" y="0" font-family="'Georgia', serif" font-size="52" font-weight="900" fill="#dc2626" text-anchor="middle">9</text>
    <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(0, 32) scale(0.45) " />
  </g>

  <!-- Center Card Artwork / Pips -->
  
      <g>
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(160, 200) scale(0.95) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(340, 200) scale(0.95) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(160, 300) scale(0.95) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(340, 300) scale(0.95) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(250, 350) scale(1) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(160, 400) scale(0.95) rotate(180)" />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(340, 400) scale(0.95) rotate(180)" />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(160, 500) scale(0.95) rotate(180)" />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(340, 500) scale(0.95) rotate(180)" />
      </g>
    

  <!-- Bottom-Right Inverted Corner Index -->
  <g transform="translate(438, 618) rotate(180)">
    <text x="0" y="0" font-family="'Georgia', serif" font-size="52" font-weight="900" fill="#dc2626" text-anchor="middle">9</text>
    <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(0, 32) scale(0.45) " />
  </g>
</svg>