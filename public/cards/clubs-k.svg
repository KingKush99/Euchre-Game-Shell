<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer Cardstock with Corner Radii -->
  <rect x="8" y="8" width="484" height="684" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="22" y="22" width="456" height="656" rx="20" fill="none" stroke="#f1f5f9" stroke-width="2"/>
  <rect x="30" y="30" width="440" height="640" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(62, 82)">
    <text x="0" y="0" font-family="'Georgia', serif" font-size="52" font-weight="900" fill="#0f172a" text-anchor="middle">K</text>
    <path d="M 0,-28 C 10,-28 16,-18 16,-8 C 16,0 8,8 2,9 C 12,5 28,12 28,24 C 28,34 18,42 6,42 C 4,42 2,40 0,38 C -2,40 -4,42 -6,42 C -18,42 -28,34 -28,24 C -28,12 -12,5 -2,9 C -8,8 -16,0 -16,-8 C -16,-18 -10,-28 0,-28 Z M -4,34 L -10,48 L 10,48 L 4,34 Z" fill="#0f172a" transform="translate(0, 32) scale(0.45) " />
  </g>

  <!-- Center Card Artwork / Pips -->
  
    <g transform="translate(100, 140)">
      <!-- Outer Court Border -->
      <rect x="0" y="0" width="300" height="420" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="4" />
      <rect x="6" y="6" width="288" height="408" rx="8" fill="#f1f5f9" stroke="#eab308" stroke-width="2" />
      <line x1="6" y1="210" x2="294" y2="210" stroke="#0f172a" stroke-width="3" />

      <!-- Top Half Royal Illustration -->
      <g transform="translate(150, 105)">
        <!-- Royal Robe & Shoulder Pattern -->
        <path d="M -90,60 L -110,100 L 110,100 L 90,60 L 50,20 L -50,20 Z" fill="#0f172a" />
        <path d="M -70,30 L 70,30 L 80,90 L -80,90 Z" fill="#eab308" opacity="0.9" />
        <path d="M -40,30 L 0,80 L 40,30 Z" fill="#2563eb" />

        <!-- Head / Face -->
        <circle cx="0" cy="-10" r="34" fill="#fef3c7" stroke="#0f172a" stroke-width="2.5" />
        <!-- Crown / Headdress -->
        <path d="M -30,-40 L -40,-70 L -15,-52 L 0,-75 L 15,-52 L 40,-70 L 30,-40 Z" fill="#eab308" stroke="#0f172a" stroke-width="2" />

        <!-- Facial Features -->
        <circle cx="-10" cy="-14" r="3" fill="#0f172a" />
        <circle cx="10" cy="-14" r="3" fill="#0f172a" />
        <path d="M -8,8 Q 0,16 8,8" fill="none" stroke="#0f172a" stroke-width="2" />

        <!-- Held Item Emblem -->
        <line x1="55" y1="-30" x2="55" y2="70" stroke="#eab308" stroke-width="5" /><path d="M 50,-40 L 60,-40 L 55,-55 Z" fill="#0f172a" />

        <!-- Suit Pip Emblem on Robe -->
        <path d="M 0,-28 C 10,-28 16,-18 16,-8 C 16,0 8,8 2,9 C 12,5 28,12 28,24 C 28,34 18,42 6,42 C 4,42 2,40 0,38 C -2,40 -4,42 -6,42 C -18,42 -28,34 -28,24 C -28,12 -12,5 -2,9 C -8,8 -16,0 -16,-8 C -16,-18 -10,-28 0,-28 Z M -4,34 L -10,48 L 10,48 L 4,34 Z" fill="#0f172a" transform="translate(-70, -20) scale(0.45) " />
      </g>

      <!-- Bottom Half Inverted Royal Illustration -->
      <g transform="translate(150, 315) rotate(180)">
        <path d="M -90,60 L -110,100 L 110,100 L 90,60 L 50,20 L -50,20 Z" fill="#0f172a" />
        <path d="M -70,30 L 70,30 L 80,90 L -80,90 Z" fill="#eab308" opacity="0.9" />
        <path d="M -40,30 L 0,80 L 40,30 Z" fill="#2563eb" />

        <circle cx="0" cy="-10" r="34" fill="#fef3c7" stroke="#0f172a" stroke-width="2.5" />
        <path d="M -30,-40 L -40,-70 L -15,-52 L 0,-75 L 15,-52 L 40,-70 L 30,-40 Z" fill="#eab308" stroke="#0f172a" stroke-width="2" />

        <circle cx="-10" cy="-14" r="3" fill="#0f172a" />
        <circle cx="10" cy="-14" r="3" fill="#0f172a" />
        <path d="M -8,8 Q 0,16 8,8" fill="none" stroke="#0f172a" stroke-width="2" />

        <line x1="55" y1="-30" x2="55" y2="70" stroke="#eab308" stroke-width="5" /><path d="M 50,-40 L 60,-40 L 55,-55 Z" fill="#0f172a" />

        <path d="M 0,-28 C 10,-28 16,-18 16,-8 C 16,0 8,8 2,9 C 12,5 28,12 28,24 C 28,34 18,42 6,42 C 4,42 2,40 0,38 C -2,40 -4,42 -6,42 C -18,42 -28,34 -28,24 C -28,12 -12,5 -2,9 C -8,8 -16,0 -16,-8 C -16,-18 -10,-28 0,-28 Z M -4,34 L -10,48 L 10,48 L 4,34 Z" fill="#0f172a" transform="translate(-70, -20) scale(0.45) " />
      </g>
    </g>
  

  <!-- Bottom-Right Inverted Corner Index -->
  <g transform="translate(438, 618) rotate(180)">
    <text x="0" y="0" font-family="'Georgia', serif" font-size="52" font-weight="900" fill="#0f172a" text-anchor="middle">K</text>
    <path d="M 0,-28 C 10,-28 16,-18 16,-8 C 16,0 8,8 2,9 C 12,5 28,12 28,24 C 28,34 18,42 6,42 C 4,42 2,40 0,38 C -2,40 -4,42 -6,42 C -18,42 -28,34 -28,24 C -28,12 -12,5 -2,9 C -8,8 -16,0 -16,-8 C -16,-18 -10,-28 0,-28 Z M -4,34 L -10,48 L 10,48 L 4,34 Z" fill="#0f172a" transform="translate(0, 32) scale(0.45) " />
  </g>
</svg>