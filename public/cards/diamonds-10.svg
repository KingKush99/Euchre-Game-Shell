<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Outer Cardstock with Corner Radii -->
  <rect x="8" y="8" width="484" height="684" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="22" y="22" width="456" height="656" rx="20" fill="none" stroke="#fee2e2" stroke-width="2"/>
  <rect x="30" y="30" width="440" height="640" rx="16" fill="none" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Top-Left Corner Index -->
  <g transform="translate(62, 82)">
    <text x="0" y="0" font-family="'Arial Narrow', 'Condensed', sans-serif" font-size="56" font-weight="900" fill="#dc2626" text-anchor="middle">10</text>
    <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(0, 32) scale(0.45) " />
  </g>

  <!-- Center Card Artwork / Pips -->
  
      <g>
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(160, 190) scale(0.9) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(340, 190) scale(0.9) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(250, 240) scale(0.9) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(160, 310) scale(0.9) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(340, 310) scale(0.9) " />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(160, 390) scale(0.9) rotate(180)" />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(340, 390) scale(0.9) rotate(180)" />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(250, 460) scale(0.9) rotate(180)" />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(160, 510) scale(0.9) rotate(180)" />
        <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(340, 510) scale(0.9) rotate(180)" />
      </g>
    

  <!-- Bottom-Right Inverted Corner Index -->
  <g transform="translate(438, 618) rotate(180)">
    <text x="0" y="0" font-family="'Arial Narrow', 'Condensed', sans-serif" font-size="56" font-weight="900" fill="#dc2626" text-anchor="middle">10</text>
    <path d="M 0,-34 L 26,0 L 0,34 L -26,0 Z" fill="#dc2626" transform="translate(0, 32) scale(0.45) " />
  </g>
</svg>